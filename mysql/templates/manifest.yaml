# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: expense
  labels:
    app: mysql
    tier: db
    project: expense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
      tier: db
      project: expense
  template:
    metadata:
      labels:
        app: mysql
        tier: db
        project: expense
    spec:
      containers:
      - name: mysql
        image: srinivasdevops97/mysql:{{ .Values.deployment.imageVersion }}
---
# Service
kind: Service
apiVersion: v1
metadata:
  name: mysql  # name of the service
  namespace: expense
spec:
  selector:
    app: mysql
    tier: db
    project: expense
  ports:       # list of the ports
  - name: mysql-port
    protocol: TCP
    port: 3306   # service port
    targetPort: 3306     # container port(another port)
