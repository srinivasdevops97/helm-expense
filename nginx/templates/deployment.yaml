# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense
  labels:
    app: nginx
    tier: frontend
spec:
  # modify replicas according to your case
  replicas: {{ .Values.deployment.replicas }}
  selector:
    # These are used to select the pod to create replicas
    matchLabels:
      app: nginx
      tier: frontend
  # this is the pod definition
  template:
    metadata:
      # thses labels belongs to pod
      labels:
        app: nginx
        tier: frontend
    spec:
      containers:
      - name: nginx
        # This is called as placeholder
        image: nginx:{{ .Values.deployment.imageVersion }}